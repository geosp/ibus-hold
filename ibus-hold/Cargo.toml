[package]
name = "ibus-hold"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later OR GPL-3.0-or-later"
authors = ["geosp"]
description = "macOS-style press-and-hold accent picker for ibus"
repository = "https://github.com/geosp/ibus-hold"
publish = false

[[bin]]
name = "ibus-engine-hold"
path = "src/main.rs"

[dependencies]
librush = { path = "../librush" }
tokio = { version = "^1.53.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
zbus = { version = "^5.18.0", default-features = false, features = ["tokio"] }
xkeysym = "^0.2.1"
log = "^0.4"
env_logger = "^0.11"
